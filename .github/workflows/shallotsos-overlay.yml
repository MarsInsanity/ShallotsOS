name: Build ShallotsOS overlay

# Builds the ShallotsOS FrogUI core and the latest ShallotsOS_picoarch (the
# emulator frontend) with the public SF3000 toolchain, and packs them with the
# OnionOS theme files as one SD-card overlay. It creates no release: the result
# is a workflow artifact to copy onto a card that already runs TreeFrogUI.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'frogui/**'
      - 'assets/onion/**'
      - 'assets/system-icons/**'
      - 'sdcard/cubegm/xgame-logo.bmp'
      - 'apps/video_player/**'
      - '.github/workflows/shallotsos-overlay.yml'
  workflow_dispatch:
    inputs:
      picoarch_ref:
        description: ShallotsOS_picoarch branch, tag or commit to build
        default: claude/gameswitcher-fn-hold
      hcsnes_ref:
        description: HCSNES branch, tag or commit to build
        default: main
      pcsx4all_ref:
        description: ShallotsOS_pcsx4all branch, tag or commit to build
        default: claude/shallotsos-menu-integration

permissions:
  contents: read

env:
  # The picoarch branch pushes build from, unless a manual run names another.
  PICOARCH_REF: ${{ inputs.picoarch_ref || 'claude/gameswitcher-fn-hold' }}
  HCSNES_REF: ${{ inputs.hcsnes_ref || 'main' }}
  PCSX4ALL_REF: ${{ inputs.pcsx4all_ref || 'claude/shallotsos-menu-integration' }}
  TOOLCHAIN_URL: https://github.com/game-de-it/sf3000/releases/download/sf3000_toolchain_v0.1/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ShallotsOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out ShallotsOS_picoarch
        uses: actions/checkout@v4
        with:
          repository: MarsInsanity/ShallotsOS_picoarch
          ref: ${{ env.PICOARCH_REF }}
          path: picoarch-src
          submodules: recursive

      # HCSNES: an experimental SNES core (a modified Snes9x 2005), offered
      # as an extra SNES emulator in the Y menu.
      - name: Check out HCSNES
        uses: actions/checkout@v4
        with:
          repository: MarsInsanity/HCSNES
          ref: ${{ env.HCSNES_REF }}
          path: hcsnes-src

      # PCSX4ALL: the PS1 emulator (standalone), with picoarch's menu and keys.
      - name: Check out ShallotsOS_pcsx4all
        uses: actions/checkout@v4
        with:
          repository: MarsInsanity/ShallotsOS_pcsx4all
          ref: ${{ env.PCSX4ALL_REF }}
          path: pcsx4all-src

      - name: Install the SF3000 toolchain
        run: |
          set -euo pipefail
          root="$HOME/sf3000-work/sf3000toolchain"
          mkdir -p "$root"
          curl -fL --retry 4 -o "$RUNNER_TEMP/toolchain.tar.gz" "$TOOLCHAIN_URL"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$root"
          sdk="$root/mipsel-buildroot-linux-gnu_sdk-buildroot"
          (cd "$sdk" && ./relocate-sdk.sh)
          # The paths frogui/Makefile uses by default.
          test -x "$sdk/opt/ext-toolchain/bin/mips-mti-linux-gnu-gcc"
          test -d "$sdk/mipsel-buildroot-linux-gnu/sysroot/usr/include/freetype2"
          "$sdk/opt/ext-toolchain/bin/mips-mti-linux-gnu-gcc" --version | head -n 1

      # frogui/Makefile's first rule is init_submodules, so name the target.
      - name: Build frogui_libretro.so
        run: |
          make -C frogui all -j"$(nproc)"
          file frogui/out/frogui_libretro.so

      # The picoarch build scripts work in ~/sf3000-work/picoarch and include
      # FrogUI's common code from ../FrogUI/common.
      - name: Build picoarch and picoarch_hi
        run: |
          set -euo pipefail
          mkdir -p "$HOME/sf3000-work/FrogUI"
          cp -a frogui/common "$HOME/sf3000-work/FrogUI/common"
          cp -a picoarch-src "$HOME/sf3000-work/picoarch"
          sh "$HOME/sf3000-work/picoarch/build_sf3000.sh"
          bash "$HOME/sf3000-work/picoarch/build_picoarch_hi.sh"
          file "$HOME/sf3000-work/picoarch/picoarch" "$HOME/sf3000-work/picoarch/picoarch_hi"
          echo "PICOARCH_SHA=$(git -C picoarch-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build the HCSNES cores
        run: |
          set -euo pipefail
          sdk="$HOME/sf3000-work/sf3000toolchain/mipsel-buildroot-linux-gnu_sdk-buildroot"
          for apu in fast plus; do
            python3 hcsnes-src/tools/build.py --target sf3000 --apu "$apu" \
              --cc "$sdk/opt/ext-toolchain/bin/mips-mti-linux-gnu-gcc" \
              --sysroot "$sdk/mipsel-buildroot-linux-gnu/sysroot" --jobs "$(nproc)"
          done
          file hcsnes-src/build/sf3000/hcsnes_*_libretro.so
          echo "HCSNES_SHA=$(git -C hcsnes-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build PCSX4ALL
        run: |
          set -euo pipefail
          sh pcsx4all-src/build_sf3000.sh
          file pcsx4all-src/build/pcsx4all
          echo "PCSX4ALL_SHA=$(git -C pcsx4all-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The music and video player (cubegm/video_player).
      - name: Build the media player
        run: |
          set -euo pipefail
          make -C apps/video_player \
            TOOLCHAIN="$HOME/sf3000-work/sf3000toolchain/mipsel-buildroot-linux-gnu_sdk-buildroot" \
            FONT_SOURCE="$GITHUB_WORKSPACE/picoarch-src/libpicofe/fonts.c" \
            TARGET="$RUNNER_TEMP/video_player"
          file "$RUNNER_TEMP/video_player"

      - name: Assemble the SD-card overlay
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/overlay"
          mkdir -p "$out/cubegm/cores" "$out/frogui/onion/fonts" "$out/frogui/lang" "$out/Themes"
          cp frogui/out/frogui_libretro.so "$out/cubegm/cores/"
          cp hcsnes-src/build/sf3000/hcsnes_fast_libretro.so \
             hcsnes-src/build/sf3000/hcsnes_plus_libretro.so "$out/cubegm/cores/"
          cp "$HOME/sf3000-work/picoarch/picoarch" "$HOME/sf3000-work/picoarch/picoarch_hi" "$out/cubegm/"
          cp "$RUNNER_TEMP/video_player" "$out/cubegm/"
          cp pcsx4all-src/build/pcsx4all "$out/cubegm/"
          # Boot logo for 640x480 panels (R36SX, R36HD, GB350).
          cp sdcard/cubegm/xgame-logo.bmp "$out/cubegm/"
          cp -a assets/onion/Themes/. "$out/Themes/"
          cp -a assets/onion/Themes/ShallotsOS/skin assets/onion/Themes/ShallotsOS/icons \
                assets/onion/Themes/ShallotsOS/config.json "$out/frogui/onion/"
          cp -a assets/onion/fonts/. "$out/frogui/onion/fonts/"
          # Console icons for themes that ship none of their own.
          mkdir -p "$out/frogui/system-icons"
          cp -a assets/system-icons/. "$out/frogui/system-icons/"
          cp -a frogui/lang/builtin "$out/frogui/lang/"
          cat > "$out/SHALLOTSOS-README.txt" <<EOF
          ShallotsOS overlay (ShallotsOS ${GITHUB_SHA::7}, picoarch ${PICOARCH_SHA}, HCSNES ${HCSNES_SHA}, PCSX4ALL ${PCSX4ALL_SHA})

          Copy everything in this folder to the root of an SD card that
          already runs TreeFrogUI, replacing existing files when asked:

            cubegm/cores/frogui_libretro.so  ShallotsOS menu
            cubegm/cores/hcsnes_*_libretro.so  HCSNES Fast / Plus, experimental
                                             SNES emulators (Y on a game > Emulator)
            cubegm/picoarch, picoarch_hi     emulator frontend and in-game menu
            cubegm/video_player              music and video player
            cubegm/pcsx4all                  PS1 emulator (picoarch's menu and keys)
            cubegm/xgame-logo.bmp            ShallotsOS boot logo (640x480 panels:
                                             R36SX, R36HD, GB350; skip it on an
                                             854x480 SF3000-family console)
            Themes/ShallotsOS/               default OnionOS-format theme
            frogui/onion/                    fallback skin and Exo 2 font
            frogui/system-icons/             console icons for themes without any
            frogui/lang/builtin/             translations

          OnionOS themes (folders or .zip files) also go in Themes/.
          Pick one in Settings > Appearance > OnionOS Theme.

          To undo, copy frogui_libretro.so, picoarch and picoarch_hi from
          your TreeFrogUI release back to cubegm/, or set OnionOS Theme to off.
          EOF
          find "$out" -type f | sort | sed "s|$out/||"

      - name: Upload the overlay
        uses: actions/upload-artifact@v4
        with:
          name: ShallotsOS-overlay
          path: ${{ runner.temp }}/overlay
          if-no-files-found: error
